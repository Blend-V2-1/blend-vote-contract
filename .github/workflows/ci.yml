name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          target: wasm32v1-none
          components: rustfmt, clippy
      - name: Verify generated snapshot manifest
        run: make verify-snapshot
      - name: Check formatting and lints
        run: make check
      - name: Run tests
        run: make test
      - name: Build contract Wasm
        run: make build
