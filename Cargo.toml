[package]
name = "blend-vote-contract"
version = "1.0.0"
edition = "2021"
rust-version = "1.91.1"
license = "AGPL-3.0"
description = "Snapshot-weighted, non-binding governance polls for Blend"
repository = "https://github.com/Blend-V2-1/blend-vote-contract"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
